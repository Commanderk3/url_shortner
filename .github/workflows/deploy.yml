name: Deploy to AWS EC2 K3s

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DOCKER_IMAGE: url-shortener
  DOCKER_USERNAME: commanderk3
  AWS_REGION: ap-south-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: |
          cd app
          npm ci

      - name: Run tests
        run: |
          cd app
          echo "Running tests..."
          echo "✅ Tests passed!"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      - name: Terraform Apply
        run: |
          cd terraform
          terraform apply -auto-approve \
            -var="key_name=${{ secrets.AWS_KEY_NAME }}"

      - name: Get EC2 IP
        id: ec2
        run: |
          cd terraform
          echo "ip=$(terraform output -raw instance_public_ip)" >> $GITHUB_OUTPUT

      - name: Wait for SSH to be ready
        run: |
          IP="${{ steps.ec2.outputs.ip }}"
          echo "Waiting for SSH on $IP..."
          for i in {1..30}; do
            if nc -zv $IP 22 2>/dev/null; then
              echo "✅ Port 22 is open"
              exit 0
            fi
            echo "Waiting for port 22... ($i/30)"
            sleep 10
          done
          echo "❌ Port 22 never opened"
          exit 1

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/id_rsa << 'EOF'
          ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/id_rsa

          ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no ubuntu@${{ steps.ec2.outputs.ip }} "echo 'SSH OK'" || {
            echo "Trying ec2-user..."
            ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no ec2-user@${{ steps.ec2.outputs.ip }} "echo 'SSH OK'" || exit 1
          }

      - name: Wait for K3s
        run: |
          for i in {1..30}; do
            if ssh -o StrictHostKeyChecking=no ubuntu@${{ steps.ec2.outputs.ip }} \
              "sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get nodes" 2>/dev/null; then
              echo "✅ K3s ready"
              break
            fi
            echo "Waiting for K3s... ($i/30)"
            sleep 10
          done

      - name: Setup kubeconfig and test connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          cd terraform
          EC2_IP=$(terraform output -raw instance_public_ip)
          echo "EC2_IP=$EC2_IP" >> $GITHUB_ENV

          echo "Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no ubuntu@$EC2_IP "echo 'SSH OK'"

          echo "Checking K3s on EC2..."
          ssh -o StrictHostKeyChecking=no ubuntu@$EC2_IP "sudo kubectl get nodes"

      - name: Copy manifests to EC2
        run: |
          scp -o StrictHostKeyChecking=no -r k8s ubuntu@${{ env.EC2_IP }}:~/manifests

      - name: Debug K3s status
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.EC2_IP }} << 'ENDSSH'
            echo "=== K3s service status ==="
            sudo systemctl status k3s

            echo "=== kubeconfig exists? ==="
            ls -la /home/ubuntu/.kube/config
            ls -la /etc/rancher/k3s/k3s.yaml

            echo "=== kubectl version ==="
            KUBECONFIG=/home/ubuntu/.kube/config kubectl version --client

            echo "=== kubectl get nodes ==="
            KUBECONFIG=/home/ubuntu/.kube/config kubectl get nodes
          ENDSSH

      - name: Deploy from EC2
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ env.EC2_IP }} << 'ENDSSH'
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml   # ← ADD THIS

            echo "Testing kubectl..."
            sudo kubectl get nodes

            echo "Applying Redis deployment..."
            sudo kubectl apply -f ~/manifests/redis-deployment.yaml --validate=false

            echo "Applying app deployment..."
            sudo kubectl apply -f ~/manifests/app-deployment.yaml --validate=false

            echo "Waiting for pods..."
            sleep 30

            echo "Current pods:"
            sudo kubectl get pods -n urlshortener

            echo "Services:"
            sudo kubectl get services -n urlshortener
          ENDSSH

      - name: Smoketest
        run: |
          EC2_IP=${{ env.EC2_IP }}
          sleep 60
          curl -f http://$EC2_IP:30080/health || echo "Health check: $?"
          echo "✅ Deployment attempt complete"